<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 420" font-family="serif">
  <defs>
    <marker id="ax" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#333"/>
    </marker>
    <marker id="blue" markerWidth="9" markerHeight="6" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 9 3, 0 6" fill="#2255bb"/>
    </marker>
    <marker id="red" markerWidth="9" markerHeight="6" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 9 3, 0 6" fill="#cc2222"/>
    </marker>
  </defs>

  <!-- ===== 座標軸 ===== -->
  <line x1="60" y1="340" x2="440" y2="340" stroke="#333" stroke-width="1.4" marker-end="url(#ax)"/>
  <line x1="80" y1="360" x2="80" y2="30"  stroke="#333" stroke-width="1.4" marker-end="url(#ax)"/>
  <text x="445" y="345" font-size="18" font-style="italic" fill="#333">x</text>
  <text x="65"  y="25"  font-size="18" font-style="italic" fill="#333">y</text>
  <text x="62"  y="358" font-size="15" fill="#333">O</text>

  <!-- ===== パラメータ =====
       (x,y) = (4, 2.5)  scale=55px/unit  origin=(80,340)
       δφ ≈ 0.20 rad (≈11.5°, 図示用に誇張)
       δx = −y δφ = −0.50  → −27.5 px
       δy = +x δφ = +0.80  → +44.0 px (SVGでは−44)
       元の点 SVG: (300, 202.5)
       回転後 SVG: (272.5, 158.5)
       中間点(δx後): (272.5, 202.5)
  -->

  <!-- ===== 元のベクトル (x, y) — 青 ===== -->
  <line x1="80" y1="340" x2="293" y2="207" stroke="#2255bb" stroke-width="2.8" marker-end="url(#blue)"/>

  <!-- ===== 回転後のベクトル (x+δx, y+δy) — 赤 ===== -->
  <line x1="80" y1="340" x2="266" y2="163" stroke="#cc2222" stroke-width="2.8" marker-end="url(#red)"/>

  <!-- ===== δφ の弧 ===== -->
  <!-- 半径90pxの弧: 元の方向 → 回転後の方向 -->
  <!-- 元の角度 atan(2.5/4)≈32° 回転後≈43.5° -->
  <!-- 弧の始点: (80+90cos32°, 340−90sin32°) ≈ (156.3, 292.3) -->
  <!-- 弧の終点: (80+90cos43.5°, 340−90sin43.5°) ≈ (145.2, 278.1) -->
  <path d="M 156.3 292.3 A 90 90 0 0 0 145.2 278.1"
        fill="none" stroke="#8855cc" stroke-width="1.8"/>
  <text x="153" y="275" font-size="16" fill="#8855cc" font-style="italic">δφ</text>

  <!-- ===== δx（水平・緑） ===== -->
  <line x1="300" y1="202.5" x2="272.5" y2="202.5"
        stroke="#008800" stroke-width="2.4"/>
  <!-- 小さな端点マーク -->
  <line x1="300" y1="198" x2="300" y2="207" stroke="#008800" stroke-width="1.2"/>
  <line x1="272.5" y1="198" x2="272.5" y2="207" stroke="#008800" stroke-width="1.2"/>

  <!-- ===== δy（垂直・橙） ===== -->
  <line x1="272.5" y1="202.5" x2="272.5" y2="158.5"
        stroke="#cc6600" stroke-width="2.4"/>
  <!-- 小さな端点マーク -->
  <line x1="268" y1="202.5" x2="277" y2="202.5" stroke="#cc6600" stroke-width="1.2"/>
  <line x1="268" y1="158.5" x2="277" y2="158.5" stroke="#cc6600" stroke-width="1.2"/>

  <!-- ===== 直角マーク ===== -->
  <polyline points="278,202.5 278,208.5 272.5,208.5"
            fill="none" stroke="#666" stroke-width="1"/>

  <!-- ===== 先端どうしの変位（点線） ===== -->
  <line x1="300" y1="202.5" x2="272.5" y2="158.5"
        stroke="#888" stroke-width="1.2" stroke-dasharray="5,4"/>

  <!-- ===== ラベル ===== -->
  <!-- 元のベクトル -->
  <text x="306" y="200" font-size="17" fill="#2255bb" font-weight="bold">(x, y)</text>

  <!-- 回転後のベクトル -->
  <text x="195" y="145" font-size="15" fill="#cc2222" font-weight="bold">(x+δx, y+δy)</text>

  <!-- δx ラベル -->
  <text x="255" y="230" font-size="16" fill="#008800" font-style="italic">δx = −y δφ</text>

  <!-- δy ラベル -->
  <text x="280" y="185" font-size="16" fill="#cc6600" font-style="italic">δy = +x δφ</text>

  <!-- ===== 補助: 先端からx軸・y軸への点線 ===== -->
  <!-- 元の点から x 軸へ -->
  <line x1="300" y1="202.5" x2="300" y2="340"
        stroke="#2255bb" stroke-width="0.8" stroke-dasharray="4,4" opacity="0.4"/>
  <!-- 元の点から y 軸へ -->
  <line x1="80" y1="202.5" x2="300" y2="202.5"
        stroke="#2255bb" stroke-width="0.8" stroke-dasharray="4,4" opacity="0.4"/>

  <!-- 軸上のラベル -->
  <text x="295" y="358" font-size="14" fill="#2255bb" font-style="italic">x</text>
  <text x="58" y="207" font-size="14" fill="#2255bb" font-style="italic">y</text>

  <!-- ===== 注釈 ===== -->
  <text x="80" y="400" font-size="14" fill="#555">
    変位 δr = (−y, +x) δφ は元のベクトル (x, y) に垂直
  </text>
</svg>
